<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IFAI 絵コンテ v5 | 画像確認・FBページ</title>
    <meta
      name="description"
      content="IFAIプロモーションムービー新演出案。10枚の絵コンテを確認しながら、その場でフィードバックを書ける共有ページ。"
    />
    <meta property="og:title" content="IFAI 絵コンテ v5" />
    <meta
      property="og:description"
      content="怪しい入口から、分かりやすいAIへ。画像で確認できるIFAIプロモーションムービー絵コンテ。"
    />
    <meta property="og:image" content="./assets/storyboard-v5-sheet.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07070c;
        --ink: #f6efe2;
        --muted: #a9a297;
        --dim: #655f69;
        --panel: #11121a;
        --panel-2: #171821;
        --line: rgba(246, 239, 226, 0.16);
        --cream: #f2dcc2;
        --green: #9bd6ad;
        --cyan: #83d8d4;
        --red: #ef2636;
        --yellow: #d9c96a;
        --shadow: rgba(0, 0, 0, 0.54);
        --font:
          "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: var(--font);
        background:
          linear-gradient(rgba(131, 216, 212, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(131, 216, 212, 0.025) 1px,
            transparent 1px
          ),
          radial-gradient(
            circle at 72% 16%,
            rgba(239, 38, 54, 0.18),
            transparent 24rem
          ),
          radial-gradient(
            circle at 12% 32%,
            rgba(155, 214, 173, 0.12),
            transparent 22rem
          ),
          #07070c;
        background-size:
          12px 12px,
          12px 12px,
          auto,
          auto,
          auto;
        letter-spacing: 0;
        overflow-x: hidden;
      }

      a {
        color: inherit;
      }

      img {
        display: block;
        width: 100%;
        max-width: 100%;
      }

      button,
      textarea,
      input,
      select {
        font: inherit;
      }

      .wrap {
        width: calc(100% - 36px);
        max-width: 1240px;
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid var(--line);
        background: rgba(7, 7, 12, 0.9);
        backdrop-filter: blur(12px);
      }

      .topbar-inner {
        display: flex;
        min-height: 56px;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--cream);
        font-size: 13px;
        font-weight: 950;
        white-space: nowrap;
      }

      .brand-mark {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border: 1px solid var(--cream);
        background: #050508;
        box-shadow: 3px 3px 0 rgba(239, 38, 54, 0.74);
      }

      nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }

      nav a {
        padding: 8px 10px;
        border: 1px solid transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
        text-decoration: none;
        white-space: nowrap;
      }

      nav a:hover {
        border-color: rgba(131, 216, 212, 0.35);
        color: var(--ink);
        background: rgba(131, 216, 212, 0.07);
      }

      .hero {
        min-height: calc(100vh - 56px);
        padding: 54px 0 46px;
        display: grid;
        align-items: center;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        gap: 28px;
        align-items: end;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        color: var(--green);
        font-size: 13px;
        font-weight: 950;
      }

      .signal {
        width: 10px;
        height: 10px;
        background: var(--red);
        box-shadow:
          0 0 0 5px rgba(239, 38, 54, 0.16),
          0 0 18px rgba(239, 38, 54, 0.9);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        max-width: 760px;
        font-size: clamp(46px, 7vw, 96px);
        line-height: 0.98;
        font-weight: 950;
      }

      .lead {
        max-width: 650px;
        margin-top: 22px;
        color: var(--muted);
        font-size: clamp(16px, 1.9vw, 21px);
        font-weight: 800;
        line-height: 1.78;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border: 1px solid rgba(246, 239, 226, 0.28);
        background: rgba(17, 18, 26, 0.78);
        color: var(--ink);
        font-size: 13px;
        font-weight: 950;
        text-decoration: none;
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.35);
        cursor: pointer;
      }

      .button.primary {
        border-color: rgba(239, 38, 54, 0.75);
        background: var(--red);
        color: #fff;
      }

      .button.alt {
        border-color: rgba(155, 214, 173, 0.35);
      }

      .hero-sheet {
        border: 1px solid rgba(246, 239, 226, 0.2);
        background: #050508;
        box-shadow:
          0 24px 70px var(--shadow),
          8px 8px 0 rgba(239, 38, 54, 0.34);
      }

      .hero-sheet img {
        aspect-ratio: 1983 / 793;
        object-fit: cover;
      }

      section {
        padding: 60px 0;
        border-top: 1px solid rgba(246, 239, 226, 0.1);
      }

      .section-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 22px;
      }

      h2 {
        color: var(--cream);
        font-size: clamp(28px, 4vw, 46px);
        line-height: 1.12;
        font-weight: 950;
      }

      .note {
        width: 100%;
        max-width: 660px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 780;
        line-height: 1.75;
      }

      .sheet-frame {
        border: 1px solid rgba(246, 239, 226, 0.18);
        background: #050508;
        box-shadow: 0 18px 58px rgba(0, 0, 0, 0.32);
      }

      .sheet-frame img {
        aspect-ratio: 1983 / 793;
        object-fit: cover;
      }

      .feedback-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 18px;
        align-items: start;
      }

      .cut-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .cut-card {
        border: 1px solid rgba(246, 239, 226, 0.16);
        background:
          linear-gradient(135deg, rgba(239, 38, 54, 0.08), transparent 42%),
          rgba(17, 18, 26, 0.74);
      }

      .cut-image {
        position: relative;
        border-bottom: 1px solid rgba(246, 239, 226, 0.12);
        background: #050508;
      }

      .cut-image img {
        aspect-ratio: 1 / 1;
        object-fit: cover;
      }

      .cut-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 13px 0;
      }

      .cut-title {
        color: var(--cream);
        font-size: 16px;
        font-weight: 950;
        line-height: 1.3;
      }

      .cut-time {
        display: inline-flex;
        padding: 5px 8px;
        border: 1px solid rgba(239, 38, 54, 0.65);
        background: rgba(239, 38, 54, 0.3);
        color: #fff;
        font-size: 12px;
        font-weight: 950;
        white-space: nowrap;
      }

      .cut-form {
        display: grid;
        gap: 10px;
        padding: 13px;
      }

      .cut-form label,
      .summary-panel label {
        display: grid;
        gap: 6px;
        color: var(--green);
        font-size: 12px;
        font-weight: 950;
      }

      select,
      input,
      textarea {
        width: 100%;
        border: 1px solid rgba(131, 216, 212, 0.22);
        background: rgba(5, 5, 8, 0.82);
        color: var(--ink);
        border-radius: 0;
        outline: none;
      }

      select,
      input {
        min-height: 38px;
        padding: 8px 10px;
      }

      textarea {
        min-height: 94px;
        resize: vertical;
        padding: 10px 11px;
        font-size: 13px;
        font-weight: 760;
        line-height: 1.65;
      }

      textarea:focus,
      input:focus,
      select:focus {
        border-color: rgba(155, 214, 173, 0.68);
        box-shadow: 0 0 0 3px rgba(155, 214, 173, 0.12);
      }

      .summary-panel {
        position: sticky;
        top: 76px;
        display: grid;
        gap: 12px;
        padding: 16px;
        border: 1px solid rgba(246, 239, 226, 0.18);
        background: rgba(5, 5, 8, 0.88);
        box-shadow: 0 18px 58px rgba(0, 0, 0, 0.32);
      }

      .summary-panel h3 {
        color: var(--cream);
        font-size: 21px;
        line-height: 1.3;
      }

      .summary-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .summary-actions .button {
        width: 100%;
        min-height: 40px;
        padding: 8px 10px;
        font-size: 12px;
      }

      .summary-output {
        min-height: 260px;
      }

      .status {
        min-height: 18px;
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
      }

      .footer {
        padding: 34px 0 46px;
        color: var(--dim);
        font-size: 12px;
        font-weight: 760;
      }

      @media (max-width: 980px) {
        .hero {
          min-height: auto;
        }

        .hero-grid,
        .feedback-shell {
          grid-template-columns: minmax(0, 1fr);
        }

        .summary-panel {
          position: static;
        }
      }

      @media (max-width: 760px) {
        .wrap {
          width: calc(100% - 24px);
        }

        .topbar-inner {
          flex-direction: column;
          align-items: start;
          padding: 10px 0;
        }

        nav {
          width: 100%;
        }

        .hero {
          padding-top: 42px;
        }

        .hero-actions,
        .summary-actions {
          display: grid;
        }

        .section-head {
          display: block;
        }

        .note {
          margin-top: 10px;
        }

        .cut-grid {
          grid-template-columns: minmax(0, 1fr);
        }

        h1 {
          font-size: 43px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <div class="brand">
          <span class="brand-mark">F</span>IFAI 絵コンテ v5
        </div>
        <nav aria-label="ページ内メニュー">
          <a href="#sheet">全体</a>
          <a href="#cuts">CUT別FB</a>
          <a href="#summary">まとめ</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="wrap hero-grid">
          <div>
            <div class="eyebrow">
              <span class="signal"></span>絵で確認して、そのままFB
            </div>
            <h1>IFAI<br />絵コンテ v5</h1>
            <p class="lead">
              怪しい入口から、分かりやすいAIへ。10枚の絵を見ながら、気になったCUTだけFBできます。
            </p>
            <div class="hero-actions">
              <a class="button primary" href="#cuts">CUT別に見る</a>
              <a class="button" href="#summary">FBまとめへ</a>
              <button class="button alt" type="button" data-action="copy-share">
                共有文をコピー
              </button>
            </div>
          </div>
          <figure class="hero-sheet">
            <img
              src="./assets/storyboard-v5-sheet.png"
              alt="IFAIプロモーションムービーの10カット絵コンテ"
            />
          </figure>
        </div>
      </section>

      <section id="sheet">
        <div class="wrap">
          <div class="section-head">
            <h2>全体絵コンテ</h2>
            <p class="note">
              まずは10枚を一気に見て、流れの気持ちよさを確認するページです。
            </p>
          </div>
          <figure class="sheet-frame">
            <img
              src="./assets/storyboard-v5-sheet.png"
              alt="IFAIプロモーションムービーの10カット絵コンテ一覧"
            />
          </figure>
        </div>
      </section>

      <section id="cuts">
        <div class="wrap">
          <div class="section-head">
            <h2>CUT別FB</h2>
            <p class="note">
              入力内容はこのブラウザに自動保存されます。最後にまとめてコピーできます。
            </p>
          </div>
          <div class="feedback-shell">
            <div class="cut-grid" id="cutGrid"></div>
            <aside class="summary-panel" id="summary">
              <h3>FBまとめ</h3>
              <label>
                お名前
                <input id="reviewerName" type="text" placeholder="例: 三浦" />
              </label>
              <label>
                全体FB
                <textarea
                  id="overallFeedback"
                  placeholder="全体の印象、方向性、気になったこと"
                ></textarea>
              </label>
              <label>
                送信用まとめ
                <textarea
                  class="summary-output"
                  id="summaryOutput"
                  readonly
                ></textarea>
              </label>
              <div class="summary-actions">
                <button
                  class="button primary"
                  type="button"
                  data-action="copy-summary"
                >
                  FBをコピー
                </button>
                <button
                  class="button"
                  type="button"
                  data-action="download-json"
                >
                  JSON保存
                </button>
                <button class="button" type="button" data-action="copy-share">
                  共有文
                </button>
                <button class="button" type="button" data-action="clear">
                  入力を消す
                </button>
              </div>
              <div class="status" id="status" aria-live="polite"></div>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap">
        IFAI promotion storyboard v5 / visual storyboard feedback page.
      </div>
    </footer>

    <script>
      const cuts = [
        { id: "cut01", no: "01", time: "0-3.5s", title: "未確認シグナル" },
        { id: "cut02", no: "02", time: "3.5-6.5s", title: "IFAIが起動" },
        { id: "cut03", no: "03", time: "6.5-10s", title: "AIチーム召集" },
        { id: "cut04", no: "04", time: "10-14s", title: "朝の材料だけ残す" },
        { id: "cut05", no: "05", time: "14-18s", title: "新しい市場地図" },
        { id: "cut06", no: "06", time: "18-23s", title: "銘柄カルテ化" },
        { id: "cut07", no: "07", time: "23-28s", title: "AI評価カード" },
        { id: "cut08", no: "08", time: "28-34s", title: "チャートに聞く" },
        {
          id: "cut09",
          no: "09",
          time: "34-39.5s",
          title: "比較で根拠に変える",
        },
        {
          id: "cut10",
          no: "10",
          time: "39.5-45s",
          title: "自分の地図を持ち出す",
        },
      ];

      const storageKey = "ifai-storyboard-v5-feedback";
      const cutGrid = document.getElementById("cutGrid");
      const reviewerName = document.getElementById("reviewerName");
      const overallFeedback = document.getElementById("overallFeedback");
      const summaryOutput = document.getElementById("summaryOutput");
      const statusNode = document.getElementById("status");

      const loadState = () => {
        try {
          return JSON.parse(localStorage.getItem(storageKey) || "{}");
        } catch {
          return {};
        }
      };

      let state = {
        reviewer: "",
        overall: "",
        cuts: {},
        ...loadState(),
      };

      const setStatus = (message) => {
        statusNode.textContent = message;
        window.clearTimeout(setStatus.timer);
        setStatus.timer = window.setTimeout(() => {
          statusNode.textContent = "";
        }, 1800);
      };

      const saveState = () => {
        localStorage.setItem(storageKey, JSON.stringify(state));
        updateSummary();
      };

      const escapeHtml = (value) =>
        String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      const renderCuts = () => {
        cutGrid.innerHTML = cuts
          .map((cut) => {
            const saved = state.cuts?.[cut.id] || {};
            return `
              <article class="cut-card" id="${cut.id}">
                <figure class="cut-image">
                  <img src="./assets/storyboard-v5-cut-${cut.no}.png" alt="CUT ${cut.no} ${cut.title}" />
                </figure>
                <div class="cut-meta">
                  <h3 class="cut-title">CUT ${cut.no} ${cut.title}</h3>
                  <span class="cut-time">${cut.time}</span>
                </div>
                <div class="cut-form">
                  <label>
                    判定
                    <select data-field="rating" data-cut="${cut.id}">
                      <option value="">選択</option>
                      <option value="OK" ${saved.rating === "OK" ? "selected" : ""}>OK</option>
                      <option value="調整" ${saved.rating === "調整" ? "selected" : ""}>調整</option>
                      <option value="NG" ${saved.rating === "NG" ? "selected" : ""}>NG</option>
                    </select>
                  </label>
                  <label>
                    FB
                    <textarea data-field="comment" data-cut="${cut.id}" placeholder="この絵へのFB">${escapeHtml(saved.comment || "")}</textarea>
                  </label>
                </div>
              </article>
            `;
          })
          .join("");
      };

      const buildSummary = () => {
        const lines = [
          "IFAI 絵コンテ v5 FB",
          `名前: ${state.reviewer || ""}`,
          "",
          "【全体FB】",
          state.overall || "",
          "",
          "【CUT別FB】",
        ];

        cuts.forEach((cut) => {
          const item = state.cuts?.[cut.id] || {};
          if (!item.rating && !item.comment) return;
          lines.push(`CUT ${cut.no} ${cut.time} ${cut.title}`);
          lines.push(`判定: ${item.rating || ""}`);
          lines.push(`FB: ${item.comment || ""}`);
          lines.push("");
        });

        return lines.join("\n").trim();
      };

      const updateSummary = () => {
        summaryOutput.value = buildSummary();
      };

      const bindEvents = () => {
        reviewerName.value = state.reviewer || "";
        overallFeedback.value = state.overall || "";

        reviewerName.addEventListener("input", () => {
          state.reviewer = reviewerName.value;
          saveState();
        });

        overallFeedback.addEventListener("input", () => {
          state.overall = overallFeedback.value;
          saveState();
        });

        const handleCutInput = (event) => {
          const target = event.target;
          const cutId = target.getAttribute("data-cut");
          const field = target.getAttribute("data-field");
          if (!cutId || !field) return;
          state.cuts = state.cuts || {};
          state.cuts[cutId] = state.cuts[cutId] || {};
          state.cuts[cutId][field] = target.value;
          saveState();
        };

        cutGrid.addEventListener("input", handleCutInput);
        cutGrid.addEventListener("change", handleCutInput);

        document.querySelectorAll("[data-action]").forEach((button) => {
          button.addEventListener("click", async () => {
            const action = button.getAttribute("data-action");
            if (action === "copy-summary") {
              await navigator.clipboard.writeText(buildSummary());
              setStatus("FBをコピーしました");
            }
            if (action === "copy-share") {
              const shareText =
                "IFAIプロモーションムービーの絵コンテv5です。10枚の絵を見ながら、各CUTにそのままFBを書けます。\\n\\n見てほしい点:\\n1. 絵の方向性で進めてよさそうか\\n2. 怪しい入口から分かりやすさに着地しているか\\n3. AIキャラクターが頼れる相棒に見えるか";
              await navigator.clipboard.writeText(shareText);
              setStatus("共有文をコピーしました");
            }
            if (action === "download-json") {
              const blob = new Blob([JSON.stringify(state, null, 2)], {
                type: "application/json",
              });
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = "ifai-storyboard-v5-feedback.json";
              link.click();
              URL.revokeObjectURL(url);
              setStatus("JSONを保存しました");
            }
            if (action === "clear") {
              if (!confirm("入力したFBを消しますか?")) return;
              state = { reviewer: "", overall: "", cuts: {} };
              localStorage.removeItem(storageKey);
              reviewerName.value = "";
              overallFeedback.value = "";
              renderCuts();
              updateSummary();
              setStatus("入力を消しました");
            }
          });
        });
      };

      renderCuts();
      bindEvents();
      updateSummary();
    </script>
  </body>
</html>
